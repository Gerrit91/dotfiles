##################
###  PROGRAMS  ###
##################

$terminal = kitty
$fileManager = ADW_DISABLE_PORTAL=1 nautilus
$browser = firefox

#################
### AUTOSTART ###
#################

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprpolkitagent
# exec-once = vicinae server (started through systemctl --user enabled vicinae
exec-once = hyprpaper & hypridle & hyprsunset &
exec-once = wayle panel start
exec-once = hyprpm reload

exec = gsettings set org.gnome.desktop.interface gtk-theme "adw-gtk3"
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

#####################
### GLOBAL STUFF  ###
#####################

# https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 1.0

    #drop_shadow = true
    #shadow_range = 4
    #shadow_render_power = 3
    #col.shadow = rgba(1a1a1aee)

    shadow {
        enabled = true
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
# https://wiki.hyprland.org/Configuring/Animations/
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    # pseudotile = true
    smart_split = true
    preserve_split = true
}

# https://wiki.hyprland.org/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

debug {
  disable_logs = false
}

xwayland {
  force_zero_scaling = true
}

plugin {
    split-monitor-workspaces {
        count = 4
        keep_focused = 1
        enable_notifications = 0
        enable_wrapping = false
    }

    dynamic-cursors {
        enabled = true
        mode = rotate

        rotate {
            # length in px of the simulated stick used to rotate the cursor
            # most realistic if this is your actual cursor size
            length = 20

            # clockwise offset applied to the angle in degrees
            # this will apply to ALL shapes
            offset = 0.0
        }

        shake {
            enabled = false
        }
    }
}

layerrule {
    name = vicinae-blur
    blur = on
    ignore_alpha = 0
    match:namespace = vicinae
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = de
    kb_variant = mac
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 2
    sensitivity = -0.5
    numlock_by_default = 1

    touchpad {
        natural_scroll = true
    }
}

device {
    name = uniw0001:00-093a:0255-touchpad
    sensitivity = 0
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe_distance = 150
    workspace_swipe_min_speed_to_force = 20
    workspace_swipe_cancel_ratio = 0.2
}

gesture = 3, horizontal, workspace

group {
    groupbar {
        font_family = Font Awesome
        gradients = true
        col.active = 0xBB000000
        col.inactive = 0x88000000
    }
}

####################
### KEYBINDINGSS ###
####################

$mainMod = SUPER

# General
bind = $mainMod, T, exec, $terminal
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, SPACE, exec, vicinae toggle
bind = $mainMod, B, exec, $browser
bind = $mainMod, W, killactive,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, ESCAPE, exit,
bind = $mainMod, V, togglefloating
bind = $mainMod SHIFT, V, workspaceopt, allfloat
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, split-movetoworkspace, 1
bind = $mainMod SHIFT, 2, split-movetoworkspace, 2
bind = $mainMod SHIFT, 3, split-movetoworkspace, 3
bind = $mainMod SHIFT, 4, split-movetoworkspace, 4
bind = $mainMod SHIFT, 5, split-movetoworkspace, 5
bind = $mainMod SHIFT, 6, split-movetoworkspace, 6
bind = $mainMod SHIFT, 7, split-movetoworkspace, 7
bind = $mainMod SHIFT, 8, split-movetoworkspace, 8
bind = $mainMod SHIFT, 9, split-movetoworkspace, 9
bind = $mainMod SHIFT, 0, split-movetoworkspace, 10

bind = $mainMod ALT, RETURN, split-grabroguewindows

# bind = $mainMod SHIFT, left, movecurrentworkspacetomonitor, l
# bind = $mainMod SHIFT, right, movecurrentworkspacetomonitor, r

# move window to previous or next workspace
bind = $mainMod SHIFT, left,  movetoworkspace, e-1
bind = $mainMod SHIFT, right, movetoworkspace, e+1

# move window to other monitor
# bind = $mainMod CTRL SHIFT, left,  split-changemonitor, prev
# bind = $mainMod CTRL SHIFT, right, split-changemonitor, next

# Resizing Windows
binde = $mainMod CTRL, right, resizeactive, 30  0
binde = $mainMod CTRL, left,  resizeactive, -30 0
binde = $mainMod CTRL, up,    resizeactive, 0   -30
binde = $mainMod CTRL, down,  resizeactive, 0   30

# Move Windows within a Workspace
bind = $mainMod ALT, right, movewindow, r
bind = $mainMod ALT, left,  movewindow, l
bind = $mainMod ALT, up,    movewindow, u
bind = $mainMod ALT, down,  movewindow, d

bind = CTRL ALT, left,  workspace, -1
bind = CTRL ALT, right, workspace, +1
bind = $mainMod, mouse_down, split-cycleworkspaces, next
bind = $mainMod, mouse_up,   split-cycleworkspaces, prev
bind = CTRL SHIFT, left,  split-cycleworkspaces, prev
bind = CTRL SHIFT, right, split-cycleworkspaces, next
# Scroll through existing workspaces with mainMod + scroll
# bind = $mainMod, mouse_down, workspace, e+1
# bind = $mainMod, mouse_up, workspace, e-1

bind = $mainMod, L, exec, hyprlock
bind = CTRL ALT, SPACE, exec, vicinae vicinae://launch/core/search-emojis
bind = $mainMod ALT, SPACE, exec, ~/vscode-focus-changer.sh

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Fullscreen
bind = $mainMod, F, fullscreen,0
bind = $mainMod, Z, fullscreen,1

# Screenshots

bind = ,          PRINT, exec, hyprshot -m window
bind = $mainMod,  PRINT, exec, hyprshot -m output
bind = SHIFT,     PRINT, exec, hyprshot -m region

# Keyboard backlight
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bindel = $mainMod, XF86MonBrightnessDown, exec, hyprctl hyprsunset gamma -10
bindel = $mainMod, XF86MonBrightnessUp, exec, hyprctl hyprsunset gamma +10

# Volume and Media Control
bindel = , XF86AudioRaiseVolume, exec, amixer sset Master 5%+
bindel = , XF86AudioLowerVolume, exec, amixer sset Master 5%-
# bind = , XF86AudioMicMute, exec,
bindl = , XF86AudioMute, exec, amixer sset Master toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86Calculator, exec, gnome-calculator

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Groups
bind = $mainMod, G, togglegroup

# allow tabbing through focused windows on workspace:
bind = ALT, Tab, cyclenext
bind = ALT, Tab, fullscreen, 1
bind = $mainMod, Tab, cyclenext, prev
bind = $mainMod, Tab, fullscreen, 1

# improve performance a bit: https://wiki.hyprland.org/Configuring/Uncommon-tips--tricks/#toggle-animationsbluretc-hotkey
bind = $mainMod, ESCAPE, exec, ~/.config/hypr/gamemode.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/

workspace = w[tv1], gapsout:0, gapsin:0
workspace = f[1], gapsout:0, gapsin:0

windowrule = border_size 0, match:float no, match:workspace w[tv1]
windowrule = rounding 0, match:float no, match:workspace w[tv1]
windowrule = border_size 1, match:float no, match:workspace f[1]
windowrule = rounding 0, match:float no, match:workspace f[1]

workspace = 6, name:coding, gapsout:0, gapsin:0, rounding:0, layoutopt:orientation:top, permanent_direction_override:true, smart_split:false
workspace = 9, name:terminal

windowrule = workspace 1, match:class slack
windowrule = workspace 5, match:class $browser
windowrule = workspace 6, match:class code
windowrule = workspace 6, match:class code-oss
# windowrule = workspace 7, match:class $terminal
# windowrule = workspace 8 silent, match:class gitkraken
windowrule = workspace 9, match:class $terminal
windowrule = workspace 10 silent, match:class gitkraken

windowrule = no_blur yes, match:class $browser
windowrule = no_blur yes, match:class gitkraken
windowrule = no_blur yes, match:class code
windowrule = no_blur yes, match:class code-oss
windowrule = no_blur yes, match:xwayland yes

# negative regex prevents popup windows to maximize
windowrule = fullscreen on, match:class code, match:float no
windowrule = fullscreen on, match:class code-oss, match:float no

windowrule = float on, match:title Open File
windowrule = float on, match:title Open Files
windowrule = float on, match:title Select a File
windowrule = float on, match:title Choose wallpaper
windowrule = float on, match:title Open Folder
windowrule = float on, match:title Add Folder to Workspace
windowrule = float on, match:title Save As
windowrule = float on, match:title Library
windowrule = float on, match:title File Upload
windowrule = float on, match:title Export slide deck

windowrule = float on, match:class com.wayle.settings
windowrule = float on, match:class org.gnome.Calculator
windowrule = float on, match:class org.gnome.Nautilus
windowrule = float on, match:class org.keepassxc.KeePassXC
